<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datei teilen (ohne Server)</title>
<!--
  Rein clientseitige Variante von sendfile: spricht direkt aus dem Browser
  per WebDAV/OCS-API mit Nextcloud (keine dritte Instanz/kein eigener
  Server nötig, im Gegensatz zu cmd/webshare). Funktioniert daher aus jedem
  Netz mit Internetzugang - vorausgesetzt, Nextcloud lässt Browser-Zugriffe
  von der Origin dieser Seite per CORS zu (siehe Hinweis unten und
  README.md, Abschnitt "Direkt vom Handy, ganz ohne Server").

  Zugangsdaten (App-Passwort!) werden nur lokal im Browser (localStorage)
  gespeichert, nie irgendwohin außer an die eigene Nextcloud-Instanz
  übertragen.
-->

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<!--PRINTTOQRVIEW_CONFIG-->
<!--
  Der Kommentar oben ist ein Platzhalter für deploy/gen-share-page.sh: das
  Skript ersetzt ihn durch
    <script>window.PRINTTOQRVIEW_CONFIG = {...};</script>
  und erzeugt so eine personalisierte Kopie dieser Seite mit fest
  eingebackenen Zugangsdaten (z. B. für ein bestimmtes Handy) - dann ist
  keine Eingabe mehr nötig, einfach die erzeugte Datei öffnen. Ohne
  Generator (Original-share.html direkt geöffnet) bleibt window.
  PRINTTOQRVIEW_CONFIG undefined und das Einstellungs-Formular unten wird
  genutzt.
-->

<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --border: #dcdfe4;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --card: #242629;
      --text: #f1f1f1;
      --muted: #a3a3a3;
      --accent: #4f8dfd;
      --accent-text: #0b1220;
      --border: #3a3d42;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 480px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; text-align: center; }
  p.subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 0.95rem; margin: 0 0 12px; color: var(--muted); }
  label.field { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 12px; }
  label.field:first-child { margin-top: 0; }
  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    padding: 12px;
    margin-top: 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-size: 1rem;
  }
  #pick-label {
    display: block;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 28px 12px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    font-size: 1rem;
  }
  #pick-label.has-file { color: var(--text); border-style: solid; }
  #file-input { display: none; }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.link {
    background: none;
    color: var(--accent);
    font-weight: 500;
    font-size: 0.85rem;
    padding: 4px;
    margin-top: 8px;
    width: auto;
  }
  #status { text-align: center; color: var(--muted); margin-top: 12px; min-height: 1.2em; white-space: pre-wrap; }
  #status.error { color: var(--error); }
  #result { display: none; text-align: center; }
  #qr { display: flex; justify-content: center; margin: 8px 0 16px; }
  #qr img { background: #fff; border-radius: 12px; padding: 12px; }
  #link { word-break: break-all; font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>Datei teilen</h1>
  <p class="subtitle">Läuft komplett im Browser, ohne eigenen Server - direkt gegen Nextcloud.</p>

  <div class="card" id="settings-card">
    <h2>Nextcloud-Zugang</h2>
    <label class="field">Server-URL<input type="text" id="cfg-base-url" placeholder="https://cloud.example.com"></label>
    <label class="field">Benutzername<input type="text" id="cfg-username" autocomplete="username"></label>
    <label class="field">App-Passwort (nicht das Konto-Passwort!)<input type="password" id="cfg-password" autocomplete="current-password"></label>
    <details>
      <summary>Erweitert</summary>
      <label class="field">Zielordner<input type="text" id="cfg-target-dir" placeholder="/PrinterUploads"></label>
      <label class="field">Link gültig für (Tage)<input type="number" id="cfg-expire-days" min="1" placeholder="1"></label>
    </details>
    <button id="save-settings-btn">Speichern</button>
  </div>

  <div class="card" id="form-card" style="display:none">
    <label id="pick-label" for="file-input">Datei auswählen …</label>
    <input type="file" id="file-input">
    <input type="text" id="label-input" placeholder="Titel (optional)">
    <button id="send-btn" disabled>Senden</button>
    <button id="edit-settings-btn" class="link">Zugang ändern</button>
    <div id="status"></div>
  </div>

  <div class="card" id="result">
    <div id="qr"></div>
    <div id="link"></div>
    <button id="copy-btn">Link kopieren</button>
    <button id="reset-btn" class="secondary">Weitere Datei senden</button>
  </div>
</main>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'printtoqrview.nc-config';

  var settingsCard = document.getElementById('settings-card');
  var formCard = document.getElementById('form-card');
  var result = document.getElementById('result');

  var baseUrlInput = document.getElementById('cfg-base-url');
  var usernameInput = document.getElementById('cfg-username');
  var passwordInput = document.getElementById('cfg-password');
  var targetDirInput = document.getElementById('cfg-target-dir');
  var expireDaysInput = document.getElementById('cfg-expire-days');
  var saveSettingsBtn = document.getElementById('save-settings-btn');
  var editSettingsBtn = document.getElementById('edit-settings-btn');

  var fileInput = document.getElementById('file-input');
  var pickLabel = document.getElementById('pick-label');
  var labelInput = document.getElementById('label-input');
  var sendBtn = document.getElementById('send-btn');
  var status = document.getElementById('status');
  var qrDiv = document.getElementById('qr');
  var linkDiv = document.getElementById('link');
  var copyBtn = document.getElementById('copy-btn');
  var resetBtn = document.getElementById('reset-btn');

  function loadConfig() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveConfig(cfg) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  }

  function showSettings(cfg) {
    baseUrlInput.value = (cfg && cfg.baseUrl) || '';
    usernameInput.value = (cfg && cfg.username) || '';
    passwordInput.value = (cfg && cfg.password) || '';
    targetDirInput.value = (cfg && cfg.targetDir) || '';
    expireDaysInput.value = (cfg && cfg.linkExpireDays) || '';
    settingsCard.style.display = 'block';
    formCard.style.display = 'none';
    result.style.display = 'none';
  }

  function showForm() {
    settingsCard.style.display = 'none';
    formCard.style.display = 'block';
  }

  saveSettingsBtn.addEventListener('click', function () {
    var baseUrl = baseUrlInput.value.trim().replace(/\/+$/, '');
    var username = usernameInput.value.trim();
    var password = passwordInput.value;
    if (!baseUrl || !username || !password) {
      alert('Server-URL, Benutzername und App-Passwort sind Pflicht.');
      return;
    }
    saveConfig({
      baseUrl: baseUrl,
      username: username,
      password: password,
      targetDir: targetDirInput.value.trim() || '/PrinterUploads',
      linkExpireDays: parseInt(expireDaysInput.value, 10) || 1,
    });
    showForm();
  });

  editSettingsBtn.addEventListener('click', function () {
    showSettings(loadConfig());
  });

  // Von deploy/gen-share-page.sh eingebackene Zugangsdaten haben Vorrang vor
  // gespeicherten/eingegebenen - so ist bei einer generierten Seite direkt
  // keine Eingabe mehr nötig.
  if (window.PRINTTOQRVIEW_CONFIG) {
    saveConfig(window.PRINTTOQRVIEW_CONFIG);
  }

  var existing = loadConfig();
  if (existing) {
    showForm();
  } else {
    showSettings(null);
  }

  // --- Datei-Auswahl ---

  fileInput.addEventListener('change', function () {
    var f = fileInput.files[0];
    if (f) {
      pickLabel.textContent = f.name;
      pickLabel.classList.add('has-file');
      sendBtn.disabled = false;
    } else {
      pickLabel.textContent = 'Datei auswählen …';
      pickLabel.classList.remove('has-file');
      sendBtn.disabled = true;
    }
  });

  // --- Dateiname wie internal/filenames.Generate: Zeitstempel + sicherer
  // Titel + Endung; unsichere Zeichen werden durch "_" ersetzt. ---

  function pad(n) { return String(n).padStart(2, '0'); }

  function generateFilename(label, ext) {
    var now = new Date();
    var ts = '' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
      '-' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    var safe = label.trim().replace(/[^A-Za-z0-9_.-]+/g, '_').replace(/^_+|_+$/g, '');
    if (!safe) safe = 'file';
    if (ext && ext.charAt(0) !== '.') ext = '.' + ext;
    return ts + '_' + safe + (ext || '');
  }

  function splitLabel(name) {
    var dot = name.lastIndexOf('.');
    if (dot <= 0) return [name, ''];
    return [name.slice(0, dot), name.slice(dot)];
  }

  // --- Nextcloud WebDAV + OCS-Share-API, 1:1 dieselbe Logik wie
  // internal/nextcloud/client.go, nur als Browser-fetch(). ---

  function basicAuth(cfg) {
    return 'Basic ' + btoa(unescape(encodeURIComponent(cfg.username + ':' + cfg.password)));
  }

  function friendlyFetchError(err) {
    if (err instanceof TypeError) {
      return 'Verbindung zu Nextcloud fehlgeschlagen. Mögliche Ursache: ' +
        'Die Seite läuft auf einer anderen Adresse als Nextcloud und der ' +
        'Server erlaubt keine CORS-Zugriffe von hier aus (siehe README, ' +
        'Abschnitt "Direkt vom Handy, ganz ohne Server").';
    }
    return err.message || String(err);
  }

  async function ensureRemoteDir(cfg) {
    var segments = cfg.targetDir.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
    var path = '';
    for (var i = 0; i < segments.length; i++) {
      path += '/' + segments[i];
      var url = cfg.baseUrl + '/remote.php/dav/files/' + encodeURIComponent(cfg.username) + path;
      var resp = await fetch(url, { method: 'MKCOL', headers: { Authorization: basicAuth(cfg) } });
      if (resp.status !== 201 && resp.status !== 405) {
        throw new Error('Anlegen des Zielordners fehlgeschlagen (' + resp.status + ')');
      }
    }
  }

  async function uploadFile(cfg, filename, file) {
    await ensureRemoteDir(cfg);
    var remotePath = cfg.targetDir.replace(/\/+$/, '') + '/' + filename;
    var url = cfg.baseUrl + '/remote.php/dav/files/' + encodeURIComponent(cfg.username) + remotePath;
    var resp = await fetch(url, { method: 'PUT', headers: { Authorization: basicAuth(cfg) }, body: file });
    if ([200, 201, 204].indexOf(resp.status) === -1) {
      throw new Error('Upload fehlgeschlagen (' + resp.status + ')');
    }
    return remotePath;
  }

  async function createPublicLink(cfg, remotePath) {
    var url = cfg.baseUrl + '/ocs/v2.php/apps/files_sharing/api/v1/shares';
    var expireDate = new Date(Date.now() + cfg.linkExpireDays * 86400000).toISOString().slice(0, 10);
    var form = new URLSearchParams();
    form.set('path', remotePath);
    form.set('shareType', '3');
    form.set('expireDate', expireDate);

    var resp = await fetch(url, {
      method: 'POST',
      headers: {
        Authorization: basicAuth(cfg),
        'OCS-APIRequest': 'true',
        'Accept': 'application/json',
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: form.toString(),
    });
    if ([200, 201].indexOf(resp.status) === -1) {
      throw new Error('Share-Erstellung fehlgeschlagen (' + resp.status + ')');
    }
    var json = await resp.json();
    var shareUrl = json && json.ocs && json.ocs.data && json.ocs.data.url;
    if (!shareUrl) throw new Error('Unerwartete Antwort der Share-API');
    return shareUrl.replace(/\/+$/, '') + '/download';
  }

  // --- UI-Ablauf ---

  sendBtn.addEventListener('click', async function () {
    var file = fileInput.files[0];
    if (!file) return;
    var cfg = loadConfig();
    if (!cfg) { showSettings(null); return; }

    var parts = splitLabel(labelInput.value.trim() || file.name);
    var filename = generateFilename(parts[0], parts[1]);

    sendBtn.disabled = true;
    status.textContent = 'Wird gesendet …';
    status.classList.remove('error');

    try {
      var remotePath = await uploadFile(cfg, filename, file);
      var link = await createPublicLink(cfg, remotePath);

      status.textContent = '';
      qrDiv.innerHTML = '';
      new QRCode(qrDiv, { text: link, width: 220, height: 220 });
      linkDiv.textContent = link;
      formCard.style.display = 'none';
      result.style.display = 'block';
    } catch (err) {
      status.textContent = friendlyFetchError(err);
      status.classList.add('error');
      sendBtn.disabled = false;
    }
  });

  copyBtn.addEventListener('click', function () {
    navigator.clipboard.writeText(linkDiv.textContent).then(function () {
      copyBtn.textContent = 'Kopiert!';
      setTimeout(function () { copyBtn.textContent = 'Link kopieren'; }, 1500);
    });
  });

  resetBtn.addEventListener('click', function () {
    fileInput.value = '';
    labelInput.value = '';
    pickLabel.textContent = 'Datei auswählen …';
    pickLabel.classList.remove('has-file');
    sendBtn.disabled = true;
    status.textContent = '';
    result.style.display = 'none';
    showForm();
  });
})();
</script>
</body>
</html>
