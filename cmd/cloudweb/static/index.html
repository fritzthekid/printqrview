<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #dcdfe4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --card: #242629;
      --text: #f1f1f1;
      --muted: #a3a3a3;
      --border: #3a3d42;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    text-align: center;
    max-width: 420px;
    width: 100%;
  }
  #hint {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  #qr {
    width: 100%;
    max-width: 320px;
    aspect-ratio: 1;
    margin: 0 auto 20px;
    background: #fff;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #qr img { width: 100%; height: 100%; object-fit: contain; }
  #qr .placeholder { color: #999; font-size: 0.95rem; padding: 20px; }
  #link {
    word-break: break-all;
    font-size: 1rem;
    margin-bottom: 8px;
  }
  #password {
    font-size: 0.95rem;
    margin-bottom: 8px;
  }
  #password.hidden { display: none; }
  #password .code {
    font-weight: 600;
  }
  #password .hint {
    color: var(--muted);
  }
  #age {
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main class="card">
  <div id="hint">Link scannen (oder eintippen)</div>
  <div id="qr"><div class="placeholder">Warte auf den nächsten Druck …</div></div>
  <div id="link"></div>
  <div id="password" class="hidden"></div>
  <div id="age"></div>
</main>

<script>
(function () {
  'use strict';

  var qrDiv = document.getElementById('qr');
  var linkDiv = document.getElementById('link');
  var passwordDiv = document.getElementById('password');
  var ageDiv = document.getElementById('age');
  var lastUpdatedAt = null;

  function formatAge(updatedAt) {
    if (!updatedAt) return '';
    var seconds = Math.max(0, Math.round((Date.now() - new Date(updatedAt).getTime()) / 1000));
    if (seconds < 60) return 'zuletzt aktualisiert vor ' + seconds + 's';
    var minutes = Math.round(seconds / 60);
    return 'zuletzt aktualisiert vor ' + minutes + ' min';
  }

  function poll() {
    fetch('current.json', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.updated_at !== lastUpdatedAt) {
          lastUpdatedAt = data.updated_at;
          if (data.has_image) {
            qrDiv.innerHTML = '<img src="current.png?t=' + Date.now() + '" alt="QR-Code">';
          }
          linkDiv.textContent = data.link || '';
          if (data.password) {
            passwordDiv.innerHTML =
              '<div class="code">CODE: ' + data.password + '</div>' +
              '<div class="hint">Als Passwort bei Download verwenden: &quot;Nachname' + data.password + '&quot;</div>';
            passwordDiv.classList.remove('hidden');
          } else {
            passwordDiv.classList.add('hidden');
          }
        }
        ageDiv.textContent = formatAge(data.updated_at);
      })
      .catch(function () { /* nächster Poll versucht's erneut */ });
  }

  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
